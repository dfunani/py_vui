# Publish to PyPI and attach desktop bundles when a version tag is pushed (e.g. v0.2.0).
# PyPI: configure Trusted Publishing for this repo/workflow (recommended), or set the
# repository secret PYPI_API_TOKEN as a fallback.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  bundles:
    name: bundle (${{ matrix.os }})
    needs: build-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Build desktop app
        shell: bash
        run: python packaging/build_bundle.py --name py_vui-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: dist-bundle/*

  github-release:
    needs: [pypi, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
